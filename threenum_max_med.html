<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    
let a = Number(prompt("Enter first number:"));
let b = Number(prompt("Enter second number:"));
let c = Number(prompt("Enter third number:"));

let max, min, middle;

if (a >= b && a >= c) {
    max = a;
} else if (b >= a && b >= c) {
    max = b;
} else {
    max = c;
}

if (a <= b && a <= c) {
    min = a;
} else if (b <= a && b <= c) {
    min = b;
} else {
    min = c;
}


middle = (a + b + c) - max - min;


alert("Maximum: " + max + "\nMinimum: " + min + "\nMiddle: " + middle);
    </script>
</body>
</html>
