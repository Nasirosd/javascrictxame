<body>
    <script>
let mynum = prompt("enter number");
mynum = parseInt(mynum);

 function checkPrime(x){
    if(x ==1){
        alert( x + " is  not a prime number");
        return;
    }else if (x ==2){
        alert( x + " is   a prime number");
        return;

    }else{
        for ( let i =2; i<=x; i++){
            
            if(i === x) {
                continue;
            }
            if( x% i == 0){
            alert( x + " is   not a prime number");
        return;
        }
        }
         alert( x + " is a prime number");
        return;
    }

 }
 checkPrime(mynum); 
    </script>
